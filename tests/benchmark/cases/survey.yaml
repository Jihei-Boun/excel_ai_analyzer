cases:
  - id: survey_avg_sat_001
    domain: survey
    profile: generic
    dataset: survey_basic.xlsx
    question: "성별별 평균 만족도를 알려줘"
    tags: [aggregate]
    fixed_plan:
      steps:
        - op: aggregate
          group_by: [성별]
          metrics:
            - column: 만족도
              fn: mean
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate]
      expected_columns:
        group_by: 성별
        metric: 만족도
      expected_result:
        min_rows: 2

  - id: survey_age_sat_001
    domain: survey
    profile: generic
    dataset: survey_basic.xlsx
    question: "연령대별 만족도를 알려줘"
    tags: [aggregate]
    fixed_plan:
      steps:
        - op: aggregate
          group_by: [연령대]
          metrics:
            - column: 만족도
              fn: mean
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate]
      expected_columns:
        group_by: 연령대
      expected_result:
        min_rows: 4

  - id: survey_corr_001
    domain: survey
    profile: generic
    dataset: survey_basic.xlsx
    question: "추천의향과 만족도의 상관관계를 알려줘"
    tags: [correlation]
    fixed_plan:
      operation: correlation
      x_column: 추천의향
      y_column: 만족도
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [correlation]

  - id: survey_sat4_ratio_001
    domain: survey
    profile: generic
    dataset: survey_basic.xlsx
    question: "만족도 4 이상 응답만 보여줘"
    tags: [filter]
    fixed_plan:
      steps:
        - op: filter_rows
          numeric_filters:
            - column: 만족도
              op: ">="
              value: 4
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [filter_rows]
      expected_result:
        min_rows: 1
