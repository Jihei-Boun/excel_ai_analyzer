cases:
  - id: sales_group_sum_001
    domain: sales
    profile: sales
    dataset: sales_basic.xlsx
    question: "상품별 매출 합계를 알려줘"
    tags: [aggregate]
    fixed_plan:
      steps:
        - op: aggregate
          group_by: [상품]
          metrics:
            - column: 매출
              fn: sum
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate]
      expected_columns:
        group_by: 상품
        metric: 매출
      expected_result:
        상품A: 225000
        상품B: 156000

  - id: sales_region_avg_001
    domain: sales
    profile: sales
    dataset: sales_basic.xlsx
    question: "지역별 평균 매출을 알려줘"
    tags: [aggregate]
    fixed_plan:
      steps:
        - op: aggregate
          group_by: [지역]
          metrics:
            - column: 매출
              fn: mean
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate]
      expected_columns:
        group_by: 지역
        metric: 매출
      expected_result:
        min_rows: 2

  - id: sales_top5_001
    domain: sales
    profile: sales
    dataset: sales_basic.xlsx
    question: "매출 상위 5개 상품을 알려줘"
    tags: [ranking]
    fixed_plan:
      steps:
        - op: aggregate
          group_by: [상품]
          metrics:
            - column: 매출
              fn: sum
        - op: sort
          by: [매출]
          ascending: [false]
        - op: limit
          n: 5
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate, sort, limit]
      expected_result:
        row_count: 5

  - id: sales_compare_regions_001
    domain: sales
    profile: sales
    dataset: sales_basic.xlsx
    question: "서울과 부산 매출 비교해줘"
    tags: [compare]
    fixed_plan:
      operation: group_comparison
      group_column: 지역
      groups: [서울, 부산]
      numerator: 매출
      denominator: 수량
      rate_name: 매출비율
      prefer_subtotals: true
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [compare_groups]
      expected_result:
        row_count: 2

  - id: sales_corr_001
    domain: sales
    profile: sales
    dataset: sales_basic.xlsx
    question: "할인율과 매출의 상관관계를 알려줘"
    tags: [correlation]
    fixed_plan:
      operation: correlation
      x_column: 할인율
      y_column: 매출
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [correlation]
      expected_columns:
        x: 할인율
        y: 매출
      expected_result:
        min_rows: 1

  - id: sales_above_mean_rep_001
    domain: sales
    profile: sales
    dataset: sales_basic.xlsx
    question: "평균보다 매출이 높은 영업사원을 알려줘"
    tags: [vs_mean]
    fixed_plan:
      steps:
        - op: aggregate
          group_by: [영업사원]
          metrics:
            - column: 매출
              fn: sum
        - op: filter_vs_mean
          column: 매출
          relation: above
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate, filter_vs_mean]
      expected_result:
        min_rows: 1
