cases:
  - id: dirty_product_sum_001
    domain: dirty
    profile: generic
    dataset: dirty_basic.xlsx
    question: "상품별 매출 합계를 알려줘"
    tags: [dirty, aggregate]
    # After prepare_dataframe_for_ai / loader quirks, columns may still be messy.
    # Deterministic plan uses cleaned-like names; live measures real robustness.
    fixed_plan:
      steps:
        - op: annotate_row_types
        - op: filter_rows
          include_row_types: [detail]
        - op: aggregate
          group_by: [" 상품 명 "]
          metrics:
            - column: 매출액
              fn: sum
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate]
      notes: "dirty headers may fail plan validation — failure is informative"
      expected_result:
        min_rows: 0
      allow_semantic_warning: true

  - id: dirty_filter_nonzero_001
    domain: dirty
    profile: generic
    dataset: dirty_basic.xlsx
    question: "수량이 0보다 큰 행만 보여줘"
    tags: [dirty, filter]
    live_only: true
    expected:
      route: analysis_plan
      required_operations: [filter_rows]
      notes: "string numbers '1,000' — live robustness"

  - id: dirty_schema_001
    domain: dirty
    profile: generic
    dataset: dirty_basic.xlsx
    question: "컬럼 목록 보여줘"
    tags: [system, dirty]
    expected:
      route: system
