cases:
  - id: orders_product_amount_001
    domain: orders
    profile: generic
    dataset: orders_basic.xlsx
    question: "상품별 주문금액을 알려줘"
    tags: [aggregate]
    fixed_plan:
      steps:
        - op: aggregate
          group_by: [product]
          metrics:
            - column: order_amount
              fn: sum
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate]
      expected_columns:
        group_by: product
        metric: order_amount
      expected_result:
        노트북: 1900000
        마우스: 136000

  - id: orders_category_sales_001
    domain: orders
    profile: generic
    dataset: orders_basic.xlsx
    question: "카테고리별 매출을 알려줘"
    tags: [aggregate]
    fixed_plan:
      steps:
        - op: aggregate
          group_by: [category]
          metrics:
            - column: order_amount
              fn: sum
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate]
      expected_result:
        min_rows: 2

  - id: orders_exclude_cancel_001
    domain: orders
    profile: generic
    dataset: orders_basic.xlsx
    question: "취소 주문 제외 후 매출을 알려줘"
    tags: [filter, aggregate]
    fixed_plan:
      steps:
        - op: filter_rows
          column_filters:
            - column: status
              values: [완료]
        - op: aggregate
          group_by: [status]
          metrics:
            - column: order_amount
              fn: sum
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [filter_rows, aggregate]
      expected_result:
        완료: 3168000

  - id: orders_top_customers_001
    domain: orders
    profile: generic
    dataset: orders_basic.xlsx
    question: "고객별 주문금액 상위 5명을 알려줘"
    tags: [ranking]
    fixed_plan:
      steps:
        - op: filter_rows
          column_filters:
            - column: status
              values: [완료]
        - op: aggregate
          group_by: [customer_id]
          metrics:
            - column: order_amount
              fn: sum
        - op: sort
          by: [order_amount]
          ascending: [false]
        - op: limit
          n: 5
      interpret: false
    expected:
      route: analysis_plan
      required_operations: [aggregate, sort, limit]
      expected_result:
        max_rows: 5
        min_rows: 1
