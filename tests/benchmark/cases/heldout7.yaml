# heldout7: 사용자가 2026-11-24에 작성한 새 시험 세트 (표 4개, 질문 15개).
# 정답은 사용자 확인 + 독립 계산 일치. 요구사항 문장은 사용자의 '맞는 답을 내는 방법' 그대로.
# requirements[].check 는 _eval_cells 검사 하나. manual 은 사람이 답 문장을 읽고 판정한다.
- id: heldout7_01_mail_login_errors
  domain: heldout7
  profile: generic
  dataset: office_support.xlsx
  question: 메일로 들어온 접속 오류는 총 몇 건이야?
  tags:
  - heldout7
  - user_written
  - simple
  live_only: true
  expected:
    expected_result:
      cells:
      - 4
      max_rows: 1
    requirements:
    - text: 1) 접수 채널이 메일인 상세 건을 고른다.
      check:
        cells:
        - 4
        absent_cells:
        - 6
    - text: 2) 문의 유형이 접속 오류인 접수 건의 수를 센다. 상태는 모두 포함한다.
      check:
        cells:
        - 4
        absent_cells:
        - 5
