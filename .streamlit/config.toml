[server]
headless = false
# 8501은 다른 앱이 사용 중일 수 있음 → 기본 8502
port = 8502
address = "localhost"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8502

[client]
# minimal이면 우측 상단 메뉴(설정·테마)가 숨겨짐 → viewer로 노출
toolbarMode = "viewer"

# Streamlit 네이티브 Light/Dark 테마.
# 앱은 커스텀 CSS로 테마를 덮어쓰지 않으며, 설정(☰) 변경이 즉시 반영된다.
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f7f8fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"

[theme.dark]
primaryColor = "#3b82f6"
backgroundColor = "#0c1017"
secondaryBackgroundColor = "#151b27"
textColor = "#e8edf5"
