# 예산 표 모드(ON)일 때만 사용하는 예실대비표 프로필
# semantic_hints / plan_guidance는 LLM 추론을 돕는 힌트이며,
# enable_column_prefs=true일 때만 실행 경로에서 컬럼을 강제 보정한다.

summary: budget
currency: krw
domain: budget_table

detect_min_hits: 2
enable_column_prefs: true

preferred_labels:
  - 비목분류
  - 비용명_2
  - 비용명
  - 항목명
  - 항목

plan_guidance: >-
  Domain examples for budget vs actual tables (use ONLY when matching columns exist).
  For correlation: operation='correlation' with x_column, y_column, label_column
  (detail item name like 비용명), interpret=true. Never answer correlation with
  group_comparison or ratio_of_aggregates. Zero denominator is not correlation.
  For finding items by numeric conditions: operation='find_items' with
  numeric_filters, sort_by, output_columns (ONLY labels + condition columns +
  1-2 related metrics). Example: 이월예산 많은데 당해집행 없는 항목 →
  numeric_filters=[{실행예산_이월예산,gt,0},{집행계_당해집행,eq,0}],
  sort_by=[실행예산_이월예산] descending,
  output_columns=[비목분류,비용명_2,비용명,실행예산_이월예산,집행계_당해집행,
  집행계_합계,집행계_이월집행].
  For 비용명별/항목별 집행률 then 평균보다 낮은/높은 항목:
  operation='rate_vs_mean'; default numerator=집행계_합계, denominator=실행예산_합계;
  exclude denominator==0; do NOT use 계획예산 for this.
  For 비목분류별 top item by 잔액: operation='top_n_per_group', default
  value_column=예산잔액_합계 (예산잔액_당해잔액 only if 당해/당년 asked).
  For 계획예산 vs 실행예산 늘어난/줄어든: operation='split_by_difference'
  with left=실행예산_합계, right=계획예산; keep ALL detail rows.
  For category execution efficiency: prefer operation='group_comparison' with
  numerator=집행계_합계 (NOT 당년도집행), denominator=실행예산_합계 (NOT 계획예산);
  use 당년도 columns only when user asks 당년·당해·올해.

semantic_hints:
  likely_identifier_concepts:
    - 비용코드
    - 세목코드
    - 계정코드
    - 항목코드
  likely_label_concepts:
    - 비목분류
    - 비용명
    - 항목명
  likely_summary_labels:
    - 소계
    - 합계
    - 총계
  likely_additive_concepts:
    - 예산
    - 집행
    - 잔액
    - 가집행
  cautions:
    - summary rows should not be mixed with detail rows during aggregation
    - percentage columns should not normally be summed
    - totals should be validated after aggregation
    - misnamed code columns may need job-local renames only
    - default 집행효율/집행률 uses 집행계_합계 ÷ 실행예산_합계
    - do not use 당년도집행 or 계획예산 for 집행효율 unless the user asks for 당년 기준

column_hints:
  - 계획예산
  - 실행예산
  - 예산잔액
  - 집행계
  - 당년도집행
  - 가집행
  - 비목분류

item_column_candidates:
  - 비용명_2
  - 비용명
  - 항목
  - 세목
  - 내역

category_column_candidates:
  - 비목분류
  - 대분류
  - 중분류
  - 분류
  - 구분

budget_column_candidates:
  - 실행예산_합계
  - 계획예산
  - 당년도예산
  - 실행예산

executed_column_candidates:
  - 집행계_합계
  - 당해누계
  - 당년도집행
  - 집행계

remaining_column_candidates:
  - 예산잔액_합계
  - 예산잔액

current_remaining_column_candidates:
  - 예산잔액_당해잔액
  - 당해잔액

key_column_hints:
  - 계획예산
  - 실행예산
  - 당년도집행
  - 가집행금액
  - 집행계
  - 예산잔액

# 하단 요약 행 (소계·합계와 별도로 집계에서 제외)
footer_labels:
  - 내부흡수액
  - 외부유출액

intro: >-
  이 파일은 연구과제의 예산 계획, 집행 내역, 가집행 금액 및 잔액을
  관리하는 예실대비표입니다.

suggested_prompts:
  - 파일을 요약해줘
  - 실행예산 합계를 알려줘
  - 비목분류별 집행계 합계를 표로 보여줘
  - 비용명이 121인 데이터만 보여줘

suggested_prompts_multi_file:
  - 선택한 파일들을 통합해줘
  - 각 파일의 행 수와 컬럼 목록을 비교해줘
  - 파일별 숫자형 컬럼 합계를 표로 비교해줘

# 예산 모드 ON 시 일반 의미 규칙보다 앞에 병합
meanings:
  - hints: [항목_코드, 항목코드, itemcode]
    meaning: 각 예산 항목을 구분하는 고유 식별자
  - hints: [비용_명, 비용명, 항목명, 품목명]
    meaning: 예산 또는 집행 대상 항목 이름
  - hints: [실행_예산, 실행예산, 편성예산, 계획예산]
    meaning: 계획된 예산 금액
  - hints: [집행_금액, 집행금액, 사용금액, 지출액, 집행계]
    meaning: 실제 사용된 금액
  - hints: [집행_일자, 집행일자, 지출일, 사용일]
    meaning: 예산이 집행된 날짜
  - hints: [예산, budget]
    meaning: 예산 관련 금액
  - hints: [비목분류, 비목]
    meaning: 예산 비목/분류 라벨
