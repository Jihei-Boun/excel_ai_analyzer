# 일반 모드(기본) 프로필

summary: generic
currency: none
domain: generic
summary_builder: generic

# 도메인 컬럼 강제 보정(집행률 등) — 일반 모드에서는 끔
enable_column_prefs: false

roles: {}
column_prefs: {}
column_hint_extras: {}

# 결과 표에 우선 남길 식별/라벨 열 (스키마에 있을 때만)
preferred_labels:
  - 항목명
  - 항목
  - 이름
  - name
  - label
  - category
  - 분류
  - 구분

# 집계에서 제외할 하단 요약 라벨 (일반 모드는 비움)
footer_labels: []

# LLM 계획 모듈에 붙는 도메인 가이던스 (없으면 범용 프롬프트만)
plan_guidance: ""

semantic_hints:
  likely_identifier_concepts:
    - id
    - code
    - key
    - 코드
    - 번호
  likely_summary_labels:
    - 소계
    - 합계
    - 총계
    - subtotal
    - total
  likely_additive_concepts:
    - amount
    - qty
    - quantity
    - 금액
    - 수량
    - 매출
  cautions:
    - summary rows should not be mixed with detail rows during aggregation
    - percentage and date columns should not normally be summed
    - totals should be validated after aggregation

suggested_prompts:
  - 파일을 요약해줘
  - 각 컬럼의 데이터 타입과 결측치 개수를 알려줘
  - 첫 번째 숫자형 컬럼의 합계를 구해줘
  - 범주형 컬럼별 행 개수를 표로 보여줘

suggested_prompts_multi_file:
  - 선택한 파일들을 통합해줘
  - 각 파일의 행 수와 컬럼 목록을 비교해줘
  - 두 파일에서 공통으로 있는 컬럼을 알려줘
  - 각 파일의 숫자형 컬럼 합계를 표로 비교해줘
  - 두 파일을 공통 키로 병합한 결과를 보여줘

suggested_prompts_multi_sheet:
  - 각 시트의 행 수와 컬럼 목록을 비교해줘
  - 시트별로 숫자형 컬럼 합계를 표로 비교해줘
  - 시트 간 공통 컬럼을 알려줘
  - 파일을 요약해줘
