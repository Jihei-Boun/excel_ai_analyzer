name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.1.0,<3" openpyxl xlrd requests pytest \
            "matplotlib>=3.7.1,<4.0.0" "pillow>=10.1.0,<11.0.0" \
            python-dotenv pyyaml "sqlalchemy>=1.4,<3" "pydantic>=1,<3" \
            "sqlglot[rs]>=25.0.3,<26.0.0" "astor>=0.8.1,<0.9.0" \
            "duckdb>=1.0.0,<2.0.0" "faker>=19.12.0,<20.0.0" "openai<2"
          pip install pandasai==2.3.2 --no-deps

      - name: Run tests
        run: pytest -q
